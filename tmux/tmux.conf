# tmux settings. Copied to ~/.tmux.conf by the bootstrap.
#
# Reload it in a running tmux with: tmux source-file ~/.tmux.conf

# Scroll with the wheel, and click between panes.
set -g mouse on

# Agent output is long. The default keeps 2000 lines. Keep much more.
set -g history-limit 50000

# Without these two lines tmux falls back to 8 colours, and the
# powerbash10k prompt renders wrong.
#
# This uses screen-256color, not tmux-256color. The tmux-256color entry
# lives in the ncurses-term package, which Ubuntu WSL does not install. tmux
# refuses to start when the entry is missing. screen-256color is always
# there, and the second line restores true colour.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Count windows and panes from 1, so they match the number keys.
set -g base-index 1
setw -g pane-base-index 1
